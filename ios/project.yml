name: CrisisMap
options:
  bundleIdPrefix: net.strataperture
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: StratAperture
    INFOPLIST_KEY_CFBundleName: StratAperture
    INFOPLIST_KEY_CFBundleIconName: AppIcon
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CrisisMap:
    type: application
    platform: iOS
    sources:
      - CrisisMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.strataperture.StratAperture
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: StratAperture
        PRODUCT_MODULE_NAME: CrisisMap
        INFOPLIST_KEY_CFBundleName: StratAperture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # API base URL — override per scheme/config as needed
        API_BASE_URL: "http://localhost:3000"

  CrisisMapTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: CrisisMap
    sources:
      - CrisisMapTests
    dependencies:
      - target: CrisisMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.strataperture.StratAperture.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StratAperture.app/StratAperture"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CrisisMap:
    build:
      targets:
        CrisisMap: all
        CrisisMapTests: [test]
    test:
      targets:
        - CrisisMapTests
