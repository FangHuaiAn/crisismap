name: CrisisMap
options:
  bundleIdPrefix: com.crisismap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: CrisisMap
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CrisisMap:
    type: application
    platform: iOS
    sources:
      - CrisisMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisismap.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # API base URL — override per scheme/config as needed
        API_BASE_URL: "http://localhost:3000"

  CrisisMapTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: CrisisMap
    sources:
      - CrisisMapTests
    dependencies:
      - target: CrisisMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisismap.app.tests
        GENERATE_INFOPLIST_FILE: YES
